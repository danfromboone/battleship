plugins {
    id 'application'
    id 'java'
}

group = 'com.battleship'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.battleship.Main'
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': 'com.battleship.Main',
            'Implementation-Title': 'Battleship',
            'Implementation-Version': project.version
        )
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

run {
    standardInput = System.in
}

tasks.register('packageDeb', Exec) {
    dependsOn 'installDist'
    description = 'Builds a standalone Debian (.deb) package using dpkg-deb'
    group = 'distribution'
    commandLine './package-deb.sh'
}

tasks.register('packageMac', Exec) {
    dependsOn 'jar'
    description = 'Builds a standalone macOS Application Bundle (Battleship.app) and distribution zip'
    group = 'distribution'
    commandLine './package-macos.sh'
}

