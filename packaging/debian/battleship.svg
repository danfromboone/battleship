<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="oceanGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </radialGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="256" height="256" rx="56" fill="url(#oceanGrad)"/>
  <rect width="252" height="252" x="2" y="2" rx="54" fill="none" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Radar Grid Circles -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="128" cy="128" r="64" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="128" cy="128" r="32" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Radar Sweep & Crosshairs -->
  <line x1="128" y1="24" x2="128" y2="232" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="24" y1="128" x2="232" y2="128" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4,4"/>

  <!-- Battleship Silhouette -->
  <!-- Main Hull -->
  <path d="M 32,152 L 56,176 L 200,176 L 228,144 L 210,136 L 44,142 Z" fill="url(#shipGrad)" stroke="#64748B" stroke-width="2"/>
  
  <!-- Deck Superstructure -->
  <rect x="76" y="116" width="84" height="26" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <rect x="96" y="96" width="44" height="22" rx="2" fill="#475569" stroke="#64748B" stroke-width="1"/>
  <rect x="110" y="80" width="16" height="18" fill="#64748B"/>
  
  <!-- Mast & Radar Antenna -->
  <line x1="118" y1="80" x2="118" y2="60" stroke="#94A3B8" stroke-width="3"/>
  <line x1="108" y1="64" x2="128" y2="64" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="118" cy="56" r="3" fill="#38BDF8" filter="url(#glow)"/>

  <!-- Gun Turrets -->
  <!-- Forward Turrets -->
  <path d="M 166,132 L 192,132 L 186,122 L 168,122 Z" fill="#64748B"/>
  <line x1="186" y1="126" x2="216" y2="120" stroke="#CBD5E1" stroke-width="3"/>
  
  <!-- Aft Turrets -->
  <path d="M 54,136 L 74,136 L 72,126 L 56,126 Z" fill="#64748B"/>
  <line x1="56" y1="130" x2="30" y2="126" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Water Wave Ribbons -->
  <path d="M 20,188 Q 60,180 100,188 T 180,188 T 240,188" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 36,202 Q 76,196 116,202 T 196,202 T 236,202" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Target Crosshair Reticle (Upper Right) -->
  <circle cx="178" cy="74" r="14" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="3,2" filter="url(#glow)"/>
  <line x1="178" y1="54" x2="178" y2="94" stroke="#EF4444" stroke-width="2"/>
  <line x1="158" y1="74" x2="198" y2="74" stroke="#EF4444" stroke-width="2"/>
  <circle cx="178" cy="74" r="3" fill="#EF4444"/>
</svg>
